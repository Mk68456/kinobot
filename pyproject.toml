[project]
name = "legend-movie-bot"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    "aiogram==2.25.2",
    "aiohttp==3.8.6",
]

[dependency-groups]
dev = ["ruff==0.14.0"]

[tool.ruff]
target-version = "py311"
line-length = 110
exclude = [".venv", "data/config.py"]

[tool.ruff.lint]
select = ["F", "E9"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
